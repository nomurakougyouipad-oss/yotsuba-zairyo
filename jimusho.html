<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F1418">
<title>よつば材料注文｜事務所</title>
<link rel="icon" href="icons/zairyo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&family=Oswald:wght@500;600&display=swap">
<link rel="stylesheet" href="css/common.css">
<script>/* 覚えた明るい／暗いを、画面が出る前に当てる（ちらつかないように） */try{var t=localStorage.getItem("yotsuba-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script type="module" src="js/jimusho.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <div>
        <h1>よつば材料注文</h1>
        <p class="sub">事務所のパソコン</p>
      </div>
    </div>
    <div class="theme" role="group" aria-label="明るい／暗い">
      <button id="thLight" type="button" aria-label="明るい画面">☀</button>
      <button id="thDark" type="button" aria-label="暗い画面">☾</button>
    </div>
  </header>

  <section class="card">
    <h2>じゅんび中です</h2>
    <p class="muted">いまは「土台」だけです。依頼・注文の画面は、このあと作ります。</p>
  </section>

  <section class="card">
    <h2>つながりのたしかめ</h2>
    <ul class="checks" id="checks"></ul>
  </section>
</div>
</body>
</html>
