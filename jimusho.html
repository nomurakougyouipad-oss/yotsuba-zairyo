<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F1418">
<title>よつば資材便｜事務所</title>
<!-- 事務所用のアイコンと manifest（11/12 持ち主。現場用 index.html・材料屋用 zairyoya.html とは別。緑の「事務所」の絵） -->
<link rel="manifest" href="jimusho.webmanifest">
<link rel="icon" href="icons/jimusho-192.png?v=1">
<link rel="apple-touch-icon" href="icons/jimusho-180.png?v=1">
<meta name="apple-mobile-web-app-title" content="資材便 事務所">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&family=Oswald:wght@500;600&display=swap">
<link rel="stylesheet" href="css/common.css">
<script>/* 覚えた明るい／暗いを、画面が出る前に当てる（ちらつかないように） */try{var t=localStorage.getItem("yotsuba-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script>/* 新しいプログラムを読む（11/4）：version.json（毎回サーバーから）の番号を、プログラム・見た目の住所につけて読む。
   ブラウザに古いプログラムが残って、新しくしたのに前の動きのまま、にならないように（番号は tools/stamp.mjs で作る。読めないときは番号なしで読む） */
(function () {
  var entry = "js/jimusho.js";
  function go(v, files) {
    if (v) {
      var map = {};
      (files || []).forEach(function (f) { map[new URL(f, location.href).href] = new URL(f + "?v=" + v, location.href).href; });
      var m = document.createElement("script");
      m.type = "importmap";
      m.textContent = JSON.stringify({ imports: map });
      document.head.appendChild(m);
      var l = document.querySelector('link[href="css/common.css"]');
      if (l) l.href = "css/common.css?v=" + v;
    }
    window.__appV = v || "";
    var s = document.createElement("script");
    s.type = "module";
    s.src = entry + (v ? "?v=" + v : "");
    document.head.appendChild(s);
  }
  var done = false, once = function (v, f) { if (!done) { done = true; go(v, f); } };
  setTimeout(function () { once("", []); }, 4000);   // 4秒たっても読めなければ、番号なしで
  fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); })
    .then(function (j) { once(j && j.v, j && j.files); }, function () { once("", []); });
})();
</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <div>
        <h1>よつば資材便</h1>
        <p class="sub" id="who">事務所のパソコン</p>
      </div>
    </div>
    <div class="theme" role="group" aria-label="明るい／暗い">
      <button id="thLight" type="button" aria-label="明るい画面">☀</button>
      <button id="thDark" type="button" aria-label="暗い画面">☾</button>
    </div>
  </header>

  <main id="main" class="stack"></main>
</div>
</body>
</html>
